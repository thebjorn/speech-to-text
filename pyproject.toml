[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-text"
version = "0.1.0"
description = "Transcribe meeting recordings to text locally using faster-whisper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
# GPU acceleration for NVIDIA cards (CUDA 12 + cuDNN 9).
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cudnn-cu12>=9.0,<10.0",
]
# Speaker diarization (who-spoke-when). Pulls in PyTorch; the model is gated
# on Hugging Face. See requirements-diarize.txt for GPU/token setup notes.
diarize = [
    "pyannote.audio>=3.1",
]
# Tooling for running the test suite.
dev = [
    "pytest>=8.0",
]

[project.scripts]
transcribe-meeting = "transcribe_meeting:main"

[tool.setuptools]
# Flat single-module layout rather than a package directory.
py-modules = ["transcribe_meeting"]

[tool.pytest.ini_options]
testpaths = ["test_transcribe_meeting.py"]
